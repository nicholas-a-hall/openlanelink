sentence=Canonical openlanelink mesh wire protocol and RS485 shared-bus link.
paragraph=Every openlanelink ESP32 sketch (gateway, pinsetter, fouling, speed, ball detection) shares one definition of the NodeMessage struct, its enums, and the RS485 framing/queue. Nodes whose protocol definitions drift apart do not fail loudly -- they silently misparse every frame -- so this exists once, as a library, rather than being copy-pasted per sketch. See firmware/PROTOCOL.md.
