# Mosquitto MQTT Broker Configuration
# OpenLane Scheduler Bowling Alley

# Listen on default MQTT port
listener 1883
protocol mqtt

# WebSocket support (optional, for browser-based MQTT clients)
listener 9001
protocol websockets

# Allow anonymous connections (change in production)
allow_anonymous true

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence
persistence true
persistence_location /mosquitto/data/

# Maximum MQTT packet size (1MB is plenty for our JSON messages)
# Default is 256MB, but we use much smaller messages
max_packet_size 1048576

# Connection limits
max_connections -1
max_queued_messages 1000

# Autosave interval (seconds)
autosave_interval 300

# Uncomment for production with authentication:
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl.conf
